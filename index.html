<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0f12" />
    <meta
      name="description"
      content="BLACKSWAN NOVA — Monte Carlo Risk Engine with GARCH(1,1), Merton Jump-Diffusion & Cornish-Fisher VaR across 960+ instruments."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>BLACKSWAN NOVA — Monte Carlo Risk Engine</title>
  <script defer src="static/js/bundle.js"></script></head>
  <body>
    <noscript>JavaScript is required to view BLACKSWAN NOVA.</noscript>
    <div id="root"></div>
    <div id="engine-modal" style="display:none; position:fixed; inset:0; z-index:999999; background:#0d0f12;">
      <button onclick="document.getElementById('engine-modal').style.display='none'" style="position:absolute; top:20px; right:30px; z-index:100; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); color:white; padding:10px 20px; border-radius:30px; cursor:pointer; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; backdrop-filter: blur(10px); transition: all 0.2s;">Close Engine</button>
      <iframe src="engine.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>
    <script>
      setInterval(() => {
        // Hijack the main navigation/hero links
        const links = document.querySelectorAll('a, button');
        links.forEach(link => {
          const text = link.textContent.toUpperCase();
          if ((text.includes('INITIALIZE') || text.includes('ACCESS') || text.includes('ENGINE')) && !link.dataset.hijacked) {
            link.dataset.hijacked = 'true';
            
            // Rebuild the element to completely strip React listeners
            const newLink = link.cloneNode(true);
            newLink.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              document.getElementById('engine-modal').style.display = 'block';
            };
            if(newLink.tagName === 'BUTTON') newLink.type = 'button';
            newLink.textContent = 'INITIALIZE ENGINE';
            link.parentNode.replaceChild(newLink, link);
          }
        });
        
        // Also explicitly hijack known test IDs just to be absolutely sure
        const specificTargets = document.querySelectorAll('[data-testid="hero-cta-access"], [data-testid="waitlist-submit-button"], [data-testid="nav-access"]');
        specificTargets.forEach(target => {
          if (!target.dataset.hijacked) {
            target.dataset.hijacked = 'true';
            target.textContent = 'INITIALIZE ENGINE';
            
            const newTarget = target.cloneNode(true);
            newTarget.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              document.getElementById('engine-modal').style.display = 'block';
            };
            if(newTarget.tagName === 'BUTTON') newTarget.type = 'button';
            target.parentNode.replaceChild(newTarget, target);
          }
        });
      }, 500);
    </script>
