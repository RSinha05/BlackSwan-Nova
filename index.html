    <div id="root"></div>
    <div id="engine-modal" style="display:none; position:fixed; inset:0; z-index:999999; background:#0d0f12; flex-direction:column;">
      <iframe src="engine.html" style="width:100%; flex:1; border:none;"></iframe>
      <div style="width:100%; padding:12px 0; display:flex; justify-content:center; background:rgba(10,12,16,0.95); border-top:1px solid rgba(255,255,255,0.08);">
        <button onclick="document.getElementById('engine-modal').style.display='none'" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.7); padding:10px 32px; border-radius:30px; cursor:pointer; font-family:'Inter',sans-serif; font-size:12px; font-weight:500; letter-spacing:1px; backdrop-filter:blur(10px); transition:all 0.2s;">CLOSE ENGINE</button>
      </div>
    </div>
    <script>
      // Use capturing-phase event delegation — this fires BEFORE React's handlers
      // and cannot be overwritten by React re-renders.
      document.addEventListener('click', function(e) {
        var el = e.target;
        // Walk up the DOM tree to find the actual link/button
        while (el && el !== document) {
          var testId = el.getAttribute('data-testid') || '';
          var text = (el.textContent || '').toUpperCase();
          var href = (el.getAttribute('href') || '');
          
          // Match by data-testid (most reliable)
          var isTarget = (
            testId === 'hero-cta-access' ||
            testId === 'waitlist-submit-button' ||
            testId === 'nav-access' ||
            testId === 'nav-engine'
          );
          
          // Match by href
          if (!isTarget && (href === '#access' || href === '#engine')) {
            isTarget = true;
          }
          
          // Match by text content (only for links/buttons, not entire sections)
          if (!isTarget && (el.tagName === 'A' || el.tagName === 'BUTTON')) {
            if (text.includes('EARLY ACCESS') || text.includes('INITIALIZE ENGINE') || text.includes('REQUEST EARLY') || text.includes('JOIN WAITLIST')) {
              isTarget = true;
            }
          }
          
          if (isTarget) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            document.getElementById('engine-modal').style.display = 'flex';
            return;
          }
          el = el.parentElement;
        }
      }, true); // <-- 'true' = capturing phase, fires before React

      // Rename visible button text periodically (cosmetic only)
      setInterval(function() {
        var targets = document.querySelectorAll('[data-testid="hero-cta-access"], [data-testid="waitlist-submit-button"], [data-testid="nav-access"]');
        targets.forEach(function(t) {
          var spans = t.querySelectorAll('span');
          if (spans.length > 0) {
            spans[0].textContent = 'INITIALIZE ENGINE';
          } else if (t.childNodes.length > 0) {
            // Find the first text node
            for (var i = 0; i < t.childNodes.length; i++) {
              if (t.childNodes[i].nodeType === 3 && t.childNodes[i].textContent.trim()) {
                t.childNodes[i].textContent = 'INITIALIZE ENGINE ';
                break;
              }
            }
          }
        });
      }, 800);
    </script>
