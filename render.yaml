services:
  - type: web
    name: blackswan-nova-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: NEWSDATA_KEY
        sync: false
